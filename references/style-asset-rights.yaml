schema_version: "1.0"
policy:
  purpose: "Track provenance and permissions for bundled visual reference assets."
  statuses:
    cleared: "Evidence for the intended use is recorded."
    pending_clearance: "Do not send the image to a generation model or redistribute it as a reusable asset."
    blocked: "Do not use or distribute."
  pending_clearance_behavior:
    - "Use the matching text rules in style-specs.yaml instead of the image file."
    - "Do not treat a Pinterest URL, attribution, or a user-supplied label as a license."
    - "Replace or remove the asset before publishing a distribution that requires permission."
  clearance_evidence_required:
    - original_creator
    - original_source_url
    - license_or_written_permission
    - permitted_uses
    - reviewed_on

